name: mypipeline

on:
  pull_request:
    branches: [ "develop", "main" ]

  push:
    branches: [ "develop", "main" ]


jobs:
  build:
    runs-on: mynewrunner

    steps:

    - name: code-checkout
      uses: actions/checkout@v2
    
    - name: package the application into artiface
      run: mvn clean package

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v8.4.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    
    - name: Run Trivy scanner without cache
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: 'fs'
        scan-ref: '.'
        cache: 'false'

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
         path: target/*.jar

  docker-build:
    needs: build
    runs-on: mynewrunner
    
    outputs:
      image_tag: ${{ needs.docker-build.outputs.image_tag }}

    steps:
      - name: code-checkout
        uses: actions/checkout@v2

      - name: Download Artifact
        uses: actions/download-artifact@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      # Create Image Tag
      - name: Create Image Tag
        id: tag
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Build Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/mynarayani:${{ steps.tag.outputs.image_tag }} .
