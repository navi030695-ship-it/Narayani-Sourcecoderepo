name: mypipeline

on:
  pull_request:
    branches: [ "develop", "main" ]

  push:
    branches: [ "develop", "main" ]


jobs:
  build:
    runs-on: mynewrunner

    steps:

    - name: code-checkout
      uses: actions/checkout@v2

    - name: compile code
      uses: mvn compile

    - name: unit steps
      uses: mvn test
    
    - name: package the application into artiface
      run: mvn clean package
